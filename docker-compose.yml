services:
  audience-ops:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/var/audience_ops.db}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
      APPROVAL_THRESHOLD: ${APPROVAL_THRESHOLD:-5000}
      SYNTHETIC_STUDENT_COUNT: ${SYNTHETIC_STUDENT_COUNT:-12000}
      ALLOW_REAL_MARKETING_SYNC: ${ALLOW_REAL_MARKETING_SYNC:-false}
      REAL_SYNC_MAX_RECIPIENTS: ${REAL_SYNC_MAX_RECIPIENTS:-500}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LEARNDASH_BASE_URL: ${LEARNDASH_BASE_URL:-}
      LEARNDASH_USERNAME: ${LEARNDASH_USERNAME:-}
      LEARNDASH_APP_PASSWORD: ${LEARNDASH_APP_PASSWORD:-}
      MAILCHIMP_API_KEY: ${MAILCHIMP_API_KEY:-}
      MAILCHIMP_SERVER_PREFIX: ${MAILCHIMP_SERVER_PREFIX:-}
      MAILCHIMP_LIST_ID: ${MAILCHIMP_LIST_ID:-}
      CONSTANT_CONTACT_ACCESS_TOKEN: ${CONSTANT_CONTACT_ACCESS_TOKEN:-}
      CONSTANT_CONTACT_LIST_ID: ${CONSTANT_CONTACT_LIST_ID:-}
      CONSTANT_CONTACT_ACTIVITY_TIMEOUT_SECONDS: ${CONSTANT_CONTACT_ACTIVITY_TIMEOUT_SECONDS:-60}
    volumes:
      - ./var:/app/var
