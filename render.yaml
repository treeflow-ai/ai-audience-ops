services:
  - type: web
    name: ai-audience-ops
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: LLM_PROVIDER
        value: "mock"
      - key: ALLOW_REAL_MARKETING_SYNC
        value: "false"
      - key: DATABASE_URL
        value: "sqlite:////app/var/audience_ops.db"
      - key: POLICY_DIR
        value: "/app/policies"
      - key: MOCK_SYNC_LOG
        value: "/app/var/mock_marketing_syncs.jsonl"
      - key: SYNTHETIC_STUDENT_COUNT
        value: "12000"
      - key: SYNC_BATCH_SIZE
        value: "100"
      - key: SYNC_MAX_ATTEMPTS
        value: "3"
      - key: SYNC_RETRY_BACKOFF_SECONDS
        value: "0.25"
      - key: SYNC_LEASE_SECONDS
        value: "120"
